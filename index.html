<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>TripTab - 旅行夾錢記帳 App</title>
  
  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="TripTab" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#E6F2EC" />

  <!-- App Logo 設定 -->
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="icon" type="image/png" href="icon.png" />

  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase Compat SDKs (App + Realtime Database) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      background-color: #DCE7E1;
      background-image: 
        radial-gradient(at 10% 10%, rgba(164, 198, 174, 0.45) 0px, transparent 50%),
        radial-gradient(at 90% 85%, rgba(132, 172, 146, 0.4) 0px, transparent 55%);
    }
    input, select, textarea {
      user-select: auto;
    }
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // 初始化 Firebase
    const firebaseConfig = {
      databaseURL: "https://travel-split-app-78a36-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // 常用貨幣基準匯率
    const DEFAULT_RATES = {
      HKD: 1.0,
      JPY: 0.052,
      TWD: 0.245,
      SGD: 5.82,
      KRW: 0.0058,
      THB: 0.22,
      EUR: 8.45,
      GBP: 9.95,
      USD: 7.78,
      AUD: 5.15,
      CNY: 1.08,
      MOP: 0.97,
      CAD: 5.75,
      CHF: 8.85,
      VND: 0.00031
    };

    const DEFAULT_MEMBERS = ["我", "老公", "奶奶", "老爺", "叔仔"];
    const POOL_PAYER_KEY = "__POOL__";

    // 分類圖示與配色 (連圓餅圖 HEX 色碼)
    const CATEGORY_META = {
      "餐飲": { icon: "🍱", bg: "bg-emerald-100 text-emerald-700", color: "#34D399" },
      "交通": { icon: "🚗", bg: "bg-blue-100 text-blue-700", color: "#60A5FA" },
      "住宿": { icon: "🏨", bg: "bg-amber-100 text-amber-700", color: "#FBBF24" },
      "門票": { icon: "🎟️", bg: "bg-purple-100 text-purple-700", color: "#A78BFA" },
      "購物": { icon: "🛍️", bg: "bg-rose-100 text-rose-700", color: "#FB7185" },
      "機票": { icon: "✈️", bg: "bg-cyan-100 text-cyan-700", color: "#22D3EE" },
      "雜項": { icon: "💡", bg: "bg-slate-100 text-slate-700", color: "#94A3B8" },
      "公數注資": { icon: "👛", bg: "bg-teal-100 text-teal-800", color: "#14B8A6" }
    };

    // 產生 6 位數隨機房間代碼
    const generateRoomCode = () => {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let result = "";
      for (let i = 0; i < 6; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    };

    const sanitizeRoomId = (raw) => {
      return (raw || "").trim().toUpperCase().replace(/[.#$\[\]\/]/g, "-");
    };

    const getInitialRoom = () => {
      const params = new URLSearchParams(window.location.search);
      const urlRoom = params.get("room");
      if (urlRoom && sanitizeRoomId(urlRoom)) return sanitizeRoomId(urlRoom);
      const saved = localStorage.getItem("last_travel_room");
      if (saved && sanitizeRoomId(saved)) return sanitizeRoomId(saved);
      const newRandomCode = generateRoomCode();
      localStorage.setItem("last_travel_room", newRandomCode);
      return newRandomCode;
    };

    // 內建行李牌單據 Logo
    const TripTabLogo = ({ className = "w-11 h-11" }) => {
      const [imgErr, setImgErr] = useState(false);
      if (!imgErr) {
        return (
          <img
            src="icon.png"
            alt="TripTab Logo"
            onError={() => setImgErr(true)}
            className={`${className} rounded-2xl shadow-sm object-cover flex-shrink-0`}
          />
        );
      }
      return (
        <svg viewBox="0 0 120 120" className={`${className} rounded-2xl shadow-sm flex-shrink-0`}>
          <rect width="120" height="120" rx="28" fill="#6F8C74" />
          <path d="M60 36 C58 22, 76 16, 77 25 C78 33, 62 34, 60 40" fill="none" stroke="#DFC3A4" strokeWidth="3.5" strokeLinecap="round" />
          <path d="M48 32 L72 32 L82 44 L82 94 L75 88 L68 94 L60 88 L52 94 L45 88 L38 94 L38 44 Z" fill="#F9EFE1" />
          <path d="M60 32 L72 32 L82 44 L82 94 L75 88 L68 94 L60 88 Z" fill="#EFE0CA" opacity="0.65" />
          <circle cx="60" cy="42" r="6" fill="#6F8C74" stroke="#D7B899" strokeWidth="3" />
          <line x1="60" y1="53" x2="60" y2="85" stroke="#6F8C74" strokeWidth="2.5" strokeDasharray="4 4" strokeLinecap="round" />
          <line x1="42" y1="77" x2="76" y2="77" stroke="#6F8C74" strokeWidth="2.5" strokeDasharray="4 4" strokeLinecap="round" />
          <path d="M46 68 L53 64 L55 66 L51 71 L53 74 L51 75 L48 72 L45 73 L44 72 L46 70 Z" fill="#D5B696" />
          <path d="M70 53 L71.5 56.5 L75 58 L71.5 59.5 L70 63 L68.5 59.5 L65 58 L68.5 56.5 Z" fill="#D5B696" />
          <circle cx="74" cy="74" r="2.2" fill="none" stroke="#6F8C74" strokeWidth="1.8" />
          <circle cx="74" cy="80" r="2.2" fill="none" stroke="#6F8C74" strokeWidth="1.8" />
          <line x1="68" y1="79" x2="72.5" y2="75" stroke="#6F8C74" strokeWidth="1.8" strokeLinecap="round" />
          <line x1="68" y1="75" x2="72.5" y2="79" stroke="#6F8C74" strokeWidth="1.8" strokeLinecap="round" />
        </svg>
      );
    };

    function App() {
      const [roomId, setRoomId] = useState(getInitialRoom);
      const [roomInput, setRoomInput] = useState("");
      const [newRoomCustomName, setNewRoomCustomName] = useState("");
      const [syncStatus, setSyncStatus] = useState("connecting");
      const [isOnline, setIsOnline] = useState(navigator.onLine);

      // 雲端同步狀態
      const [tripName, setTripName] = useState("新旅程記帳 ✈️");
      const [members, setMembers] = useState(DEFAULT_MEMBERS);
      const [expenses, setExpenses] = useState([]);
      const [customRates, setCustomRates] = useState({});
      // 新增：房間預設貨幣 (用戶喺匯率頁面點選嘅貨幣會置頂並設為預設)
      const [defaultCurrency, setDefaultCurrency] = useState("JPY");

      // UI 導覽與彈窗狀態
      const [activeTab, setActiveTab] = useState("expenses");
      const [showAddForm, setShowAddForm] = useState(false);
      const [showPoolModal, setShowPoolModal] = useState(false);
      const [expenseToDelete, setExpenseToDelete] = useState(null);
      const [collapsedDays, setCollapsedDays] = useState({});

      // 匯率狀態
      const [liveRates, setLiveRates] = useState(DEFAULT_RATES);
      const [rateUpdatedText, setRateUpdatedText] = useState("載入中...");
      const [isRefreshingRates, setIsRefreshingRates] = useState(false);
      const [newCurCode, setNewCurCode] = useState("");
      const [newCurRate, setNewCurRate] = useState("");

      // 新增開支表單狀態
      const [title, setTitle] = useState("");
      const [amount, setAmount] = useState("");
      const [currency, setCurrency] = useState("JPY");
      const [payer, setPayer] = useState("我");
      const [splitWith, setSplitWith] = useState(DEFAULT_MEMBERS);
      const [category, setCategory] = useState("餐飲");
      const [expDate, setExpDate] = useState(() => new Date().toISOString().split("T")[0]);
      const [splitMode, setSplitMode] = useState("equal");
      const [customSplitsInput, setCustomSplitsInput] = useState({});

      // 公數錢包注資表單狀態
      const [poolPerPersonAmt, setPoolPerPersonAmt] = useState("10000");
      const [poolCurrency, setPoolCurrency] = useState("JPY");
      const [poolContributors, setPoolContributors] = useState(DEFAULT_MEMBERS);
      const [poolNote, setPoolNote] = useState("公數錢包注資");

      const [newMemberName, setNewMemberName] = useState("");

      // 合併即時匯率與自訂匯率
      const rates = useMemo(() => {
        return { ...liveRates, ...customRates };
      }, [liveRates, customRates]);

      // 將用戶點選嘅「預設貨幣 (defaultCurrency)」永遠排喺貨幣選項清單最頂第一位！
      const sortedCurrencies = useMemo(() => {
        const allKeys = Object.keys(rates);
        return allKeys.sort((a, b) => {
          if (a === defaultCurrency) return -1;
          if (b === defaultCurrency) return 1;
          return 0;
        });
      }, [rates, defaultCurrency]);

      // 監聽網絡連線狀態 (離線記帳支援)
      useEffect(() => {
        const handleOnline = () => setIsOnline(true);
        const handleOffline = () => setIsOnline(false);
        window.addEventListener("online", handleOnline);
        window.addEventListener("offline", handleOffline);
        return () => {
          window.removeEventListener("online", handleOnline);
          window.removeEventListener("offline", handleOffline);
        };
      }, []);

      // 抓取網上即時匯率函數
      const fetchLiveRatesFromAPI = (resetCustom = false) => {
        setIsRefreshingRates(true);
        return fetch("https://open.er-api.com/v6/latest/HKD")
          .then(res => res.json())
          .then(data => {
            if (data && data.rates) {
              const updated = {};
              const allKnownCodes = new Set([...Object.keys(DEFAULT_RATES), ...Object.keys(customRates)]);
              allKnownCodes.forEach(cur => {
                if (cur === "HKD") {
                  updated[cur] = 1.0;
                } else if (data.rates[cur]) {
                  updated[cur] = Number((1 / data.rates[cur]).toFixed(5));
                } else if (DEFAULT_RATES[cur]) {
                  updated[cur] = DEFAULT_RATES[cur];
                }
              });
              setLiveRates(prev => ({ ...prev, ...updated }));
              const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
              setRateUpdatedText(timeStr);

              if (resetCustom) {
                const remainingCustom = {};
                Object.keys(customRates).forEach(code => {
                  if (!data.rates[code] && code !== "HKD") {
                    remainingCustom[code] = customRates[code];
                  }
                });
                db.ref(`rooms/${roomId}/customRates`).set(remainingCustom);
              }
            }
          })
          .catch(() => {
            setRateUpdatedText("離線基準");
          })
          .finally(() => {
            setIsRefreshingRates(false);
          });
      };

      useEffect(() => {
        fetchLiveRatesFromAPI(false);
      }, []);

      // 監聽 Firebase 房間資料 + 本地離線緩存讀取
      useEffect(() => {
        setSyncStatus("connecting");
        localStorage.setItem("last_travel_room", roomId);

        const cachedStr = localStorage.getItem(`triptab_cache_${roomId}`);
        if (cachedStr) {
          try {
            const cached = JSON.parse(cachedStr);
            if (cached.tripName) setTripName(cached.tripName);
            if (Array.isArray(cached.members)) setMembers(cached.members);
            if (Array.isArray(cached.expenses)) setExpenses(cached.expenses);
            if (cached.customRates) setCustomRates(cached.customRates);
            if (cached.defaultCurrency) {
              setDefaultCurrency(cached.defaultCurrency);
              setCurrency(cached.defaultCurrency);
              setPoolCurrency(cached.defaultCurrency);
            }
          } catch (e) {}
        }

        const url = new URL(window.location);
        url.searchParams.set("room", roomId);
        window.history.replaceState({}, "", url);

        const roomRef = db.ref(`rooms/${roomId}`);

        const handleValue = (snapshot) => {
          const data = snapshot.val();
          if (data) {
            const tName = data.tripName || "新旅程記帳 ✈️";
            const loadedMembers = Array.isArray(data.members) && data.members.length > 0 ? data.members : DEFAULT_MEMBERS;
            const expList = data.expenses ? Object.values(data.expenses).sort((a, b) => (b.id || 0) - (a.id || 0)) : [];
            const cRates = data.customRates || {};
            const defCur = data.defaultCurrency || "JPY";

            setTripName(tName);
            setMembers(loadedMembers);
            setPayer(prev => (prev === POOL_PAYER_KEY || loadedMembers.includes(prev)) ? prev : loadedMembers[0]);
            setSplitWith(prev => {
              const valid = prev.filter(m => loadedMembers.includes(m));
              return valid.length > 0 ? valid : loadedMembers;
            });
            setPoolContributors(loadedMembers);
            setExpenses(expList);
            setCustomRates(cRates);
            setDefaultCurrency(defCur);
            setCurrency(defCur);
            setPoolCurrency(defCur);

            localStorage.setItem(`triptab_cache_${roomId}`, JSON.stringify({
              tripName: tName,
              members: loadedMembers,
              expenses: expList,
              customRates: cRates,
              defaultCurrency: defCur
            }));
          } else {
            const initialRoomData = {
              tripName: "新旅程記帳 ✈️",
              members: DEFAULT_MEMBERS,
              expenses: {},
              customRates: {},
              defaultCurrency: "JPY",
              createdAt: Date.now()
            };
            roomRef.set(initialRoomData);
          }
          setSyncStatus("synced");
        };

        const handleError = (err) => {
          console.error("Firebase error:", err);
          setSyncStatus("error");
        };

        roomRef.on("value", handleValue, handleError);
        return () => roomRef.off("value", handleValue);
      }, [roomId]);

      // 在「匯率」頁面點選某個貨幣 -> 設定為預設置頂貨幣並同步到雲端
      const handleSelectDefaultCurrency = (cur) => {
        setDefaultCurrency(cur);
        setCurrency(cur);
        setPoolCurrency(cur);
        db.ref(`rooms/${roomId}/defaultCurrency`).set(cur);
      };

      const toHKD = (amt, curr) => {
        const r = rates[curr] || 1;
        return amt * r;
      };

      // 計算公數錢包 (Pool Money) 各貨幣餘額與總注入/總支出
      const poolSummary = useMemo(() => {
        const byCurrency = {};
        let totalTopUpHKD = 0;
        let totalSpentFromPoolHKD = 0;

        expenses.forEach(exp => {
          const cur = exp.currency || "HKD";
          const amt = Number(exp.amount) || 0;
          if (exp.type === "pool_topup") {
            if (!byCurrency[cur]) byCurrency[cur] = { topup: 0, spent: 0, balance: 0 };
            byCurrency[cur].topup += amt;
            byCurrency[cur].balance += amt;
            totalTopUpHKD += toHKD(amt, cur);
          } else if (exp.payer === POOL_PAYER_KEY) {
            if (!byCurrency[cur]) byCurrency[cur] = { topup: 0, spent: 0, balance: 0 };
            byCurrency[cur].spent += amt;
            byCurrency[cur].balance -= amt;
            totalSpentFromPoolHKD += toHKD(amt, cur);
          }
        });

        const remainHKD = totalTopUpHKD - totalSpentFromPoolHKD;
        return {
          byCurrency,
          totalTopUpHKD,
          totalSpentFromPoolHKD,
          remainHKD,
          hasActivity: Object.keys(byCurrency).length > 0
        };
      }, [expenses, rates]);

      // 檢查當前輸入嘅「公數錢包支付」係咪超過公數餘額
      const currentCurrencyPoolBalance = useMemo(() => {
        return poolSummary.byCurrency[currency]?.balance || 0;
      }, [poolSummary, currency]);

      const isPoolInsufficient = useMemo(() => {
        if (payer !== POOL_PAYER_KEY) return false;
        const numAmt = parseFloat(amount) || 0;
        return currentCurrencyPoolBalance <= 0 || numAmt > currentCurrencyPoolBalance + 0.0001;
      }, [payer, amount, currentCurrencyPoolBalance]);

      // 計算每筆開支入面「每個人實際分攤幾多原幣」
      const getExpenseMemberShares = (exp) => {
        const total = Number(exp.amount) || 0;
        const splits = Array.isArray(exp.splitWith) && exp.splitWith.length > 0 ? exp.splitWith : [];
        const shares = {};
        if (splits.length === 0) return shares;

        if (exp.splitMode === "custom" && exp.customSplits) {
          let specifiedSum = 0;
          const unspecifiedMembers = [];
          splits.forEach(m => {
            const val = exp.customSplits[m];
            if (val !== undefined && val !== "" && !isNaN(Number(val))) {
              const num = Number(val);
              shares[m] = num;
              specifiedSum += num;
            } else {
              unspecifiedMembers.push(m);
            }
          });
          const remainder = Math.max(0, total - specifiedSum);
          if (unspecifiedMembers.length > 0) {
            const eachRem = remainder / unspecifiedMembers.length;
            unspecifiedMembers.forEach(m => {
              shares[m] = eachRem;
            });
          }
        } else {
          const each = total / splits.length;
          splits.forEach(m => {
            shares[m] = each;
          });
        }
        return shares;
      };

      // 建立新房間
      const handleCreateNewRoom = (e) => {
        e.preventDefault();
        const customTitle = newRoomCustomName.trim();
        if (!customTitle) {
          alert("請先輸入新旅程名稱（例如：沖繩家族遊）！");
          return;
        }
        const newCode = generateRoomCode();
        const initialRoomData = {
          tripName: customTitle,
          members: DEFAULT_MEMBERS,
          expenses: {},
          customRates: {},
          defaultCurrency: defaultCurrency || "JPY",
          createdAt: Date.now()
        };
        db.ref(`rooms/${newCode}`).set(initialRoomData).then(() => {
          setRoomId(newCode);
          setNewRoomCustomName("");
          setActiveTab("expenses");
          alert(`🎉 成功建立新房間！\n\n旅程名稱：${customTitle}\n專屬 6 位房號：${newCode}`);
        });
      };

      // 切換房間
      const handleSwitchRoom = (e) => {
        e.preventDefault();
        const clean = sanitizeRoomId(roomInput);
        if (!clean) {
          alert("請輸入房間代碼！");
          return;
        }
        db.ref(`rooms/${clean}`).once("value").then((snapshot) => {
          if (snapshot.exists()) {
            const data = snapshot.val();
            setRoomId(clean);
            setRoomInput("");
            setActiveTab("expenses");
            alert(`✅ 成功進入房間：${data.tripName || clean}（房號：${clean}）`);
          } else {
            alert(`❌ 搵唔到房號「${clean}」，請檢查代碼有冇打錯！`);
          }
        });
      };

      const handleTripNameBlur = () => {
        db.ref(`rooms/${roomId}/tripName`).set(tripName);
      };

      // 迷你計數機快捷鍵 (+10%, x1.08, x1.10, ÷2)
      const applyQuickMath = (multiplier) => {
        const current = parseFloat(amount);
        if (isNaN(current) || current <= 0) {
          alert("請先喺金額欄輸入咗基本數字先！");
          return;
        }
        const nextVal = Math.round(current * multiplier * 100) / 100;
        setAmount(String(nextVal));
      };

      // 預覽不等額分帳狀態
      const customSplitPreview = useMemo(() => {
        const total = parseFloat(amount) || 0;
        let specifiedSum = 0;
        const unspecified = [];
        splitWith.forEach(m => {
          const raw = customSplitsInput[m];
          if (raw !== undefined && raw !== "" && !isNaN(Number(raw))) {
            specifiedSum += Number(raw);
          } else {
            unspecified.push(m);
          }
        });
        const remainder = total - specifiedSum;
        const autoEach = unspecified.length > 0 ? Math.max(0, remainder) / unspecified.length : 0;
        return { total, specifiedSum, remainder, unspecified, autoEach };
      }, [amount, splitWith, customSplitsInput]);

      // 提交一般或公數支出 (含公數防透支強制攔截)
      const handleAddExpense = (e) => {
        e.preventDefault();
        const numAmt = parseFloat(amount);
        if (!title || isNaN(numAmt) || numAmt <= 0 || splitWith.length === 0) return;

        // 🛡️ 防透支檢查：如果揀咗「公數錢包」，必須確保該貨幣公數餘額足夠
        if (payer === POOL_PAYER_KEY) {
          const availablePool = poolSummary.byCurrency[currency]?.balance || 0;
          if (availablePool <= 0) {
            alert(`⚠️ 公數錢包目前未有 ${currency} 餘額（現有：${currency} ${availablePool.toLocaleString()}）！\n\n請先撳「＋ 每人注資公數」入錢落公數池，或者改揀某位成員私人墊支。`);
            return;
          }
          if (numAmt > availablePool + 0.0001) {
            const shortage = Math.round((numAmt - availablePool) * 100) / 100;
            alert(`⚠️ 公數錢包餘額不足，無法記帳！\n\n• 今次開支：${currency} ${numAmt.toLocaleString()}\n• 公數現有：${currency} ${availablePool.toLocaleString()}\n• 尚欠差額：${currency} ${shortage.toLocaleString()}\n\n請先為公數錢包注資，或者改由成員私人墊支！`);
            return;
          }
        }

        let savedCustomSplits = null;
        if (splitMode === "custom") {
          if (customSplitPreview.remainder < -0.01) {
            alert(`⚠️ 自訂分帳金額總和 (${customSplitPreview.specifiedSum}) 超過咗總金額 (${numAmt})！請檢查數字。`);
            return;
          }
          if (customSplitPreview.unspecified.length === 0 && Math.abs(customSplitPreview.remainder) > 0.5) {
            alert(`⚠️ 所有人都填咗自訂金額，但加埋 (${customSplitPreview.specifiedSum}) 未等於總金額 (${numAmt})！\n（貼士：留空某幾個人嘅格仔，系統會自動幫佢哋平分餘額）`);
            return;
          }
          savedCustomSplits = {};
          splitWith.forEach(m => {
            const raw = customSplitsInput[m];
            if (raw !== undefined && raw !== "" && !isNaN(Number(raw))) {
              savedCustomSplits[m] = Number(raw);
            } else {
              savedCustomSplits[m] = Number(customSplitPreview.autoEach.toFixed(2));
            }
          });
        }

        const id = Date.now();
        const newExp = {
          id,
          type: "expense",
          title,
          amount: numAmt,
          currency,
          payer,
          splitWith,
          splitMode,
          customSplits: savedCustomSplits,
          category,
          date: expDate || new Date().toISOString().split("T")[0]
        };

        setExpenses(prev => [newExp, ...prev]);
        db.ref(`rooms/${roomId}/expenses/${id}`).set(newExp);

        setTitle("");
        setAmount("");
        setSplitMode("equal");
        setCustomSplitsInput({});
        setShowAddForm(false);
      };

      // 提交「公數錢包注資 (Pool Top-up)」
      const handleAddPoolTopUp = (e) => {
        e.preventDefault();
        const perAmt = parseFloat(poolPerPersonAmt);
        if (isNaN(perAmt) || perAmt <= 0 || poolContributors.length === 0) return;

        const totalPoolAdded = perAmt * poolContributors.length;
        const id = Date.now();
        const topUpExp = {
          id,
          type: "pool_topup",
          title: `${poolNote || "公數注資"} (每人 ${poolCurrency} ${perAmt.toLocaleString()})`,
          amount: totalPoolAdded,
          perPersonAmount: perAmt,
          currency: poolCurrency,
          payer: POOL_PAYER_KEY,
          contributors: poolContributors,
          splitWith: poolContributors,
          category: "公數注資",
          date: new Date().toISOString().split("T")[0]
        };

        setExpenses(prev => [topUpExp, ...prev]);
        db.ref(`rooms/${roomId}/expenses/${id}`).set(topUpExp);
        setShowPoolModal(false);
      };

      // 刪除前檢查：如果刪除嘅係「公數注資」，檢查會唔會令公數餘額變負數
      const requestDeleteExpense = (exp) => {
        if (exp.type === "pool_topup") {
          const cur = exp.currency || "HKD";
          const curBalance = poolSummary.byCurrency[cur]?.balance || 0;
          const afterDeleteBalance = curBalance - (Number(exp.amount) || 0);
          if (afterDeleteBalance < -0.0001) {
            alert(`⚠️ 無法刪除呢筆「公數注資」！\n\n因為公數錢包入面嘅錢已經洗咗一部分，如果刪走呢筆注資（${cur} ${Number(exp.amount).toLocaleString()}），會令 ${cur} 公數餘額變成負數（${cur} ${Math.round(afterDeleteBalance).toLocaleString()}）。\n\n請先刪除或修改使用公數支付嘅開支項目！`);
            return;
          }
        }
        setExpenseToDelete(exp);
      };

      const confirmDeleteExpense = () => {
        if (!expenseToDelete) return;
        const targetId = expenseToDelete.id;
        setExpenses(prev => prev.filter(x => x.id !== targetId));
        db.ref(`rooms/${roomId}/expenses/${targetId}`).remove();
        setExpenseToDelete(null);
      };

      const handleAddMember = () => {
        const name = newMemberName.trim();
        if (!name || members.includes(name)) return;
        const updated = [...members, name];
        db.ref(`rooms/${roomId}/members`).set(updated);
        setSplitWith(updated);
        setPoolContributors(updated);
        setNewMemberName("");
      };

      const handleRemoveMember = (name) => {
        if (members.length <= 2) return;
        if (!window.confirm(`確定要從房間移除成員「${name}」嗎？`)) return;
        const updated = members.filter(x => x !== name);
        db.ref(`rooms/${roomId}/members`).set(updated);
      };

      const handleRateChange = (cur, val) => {
        const num = parseFloat(val);
        if (isNaN(num) || num <= 0) return;
        db.ref(`rooms/${roomId}/customRates/${cur}`).set(num);
      };

      const handleResetSingleRate = (cur) => {
        db.ref(`rooms/${roomId}/customRates/${cur}`).remove();
      };

      const handleAddCustomCurrency = (e) => {
        e.preventDefault();
        const code = newCurCode.trim().toUpperCase();
        const rateVal = parseFloat(newCurRate);
        if (code.length !== 3 || isNaN(rateVal) || rateVal <= 0) return;
        db.ref(`rooms/${roomId}/customRates/${code}`).set(rateVal);
        // 新增自訂貨幣時，同時自動設為預設頂置貨幣
        handleSelectDefaultCurrency(code);
        setNewCurCode("");
        setNewCurRate("");
      };

      // 實際消費總額
      const realExpenses = useMemo(() => {
        return expenses.filter(e => e.type !== "pool_topup");
      }, [expenses]);

      const totalHKD = useMemo(() => {
        return realExpenses.reduce((acc, exp) => acc + toHKD(Number(exp.amount), exp.currency), 0);
      }, [realExpenses, rates]);

      // 按日期分組 (Day 1, Day 2...) 時間軸計算
      const groupedDays = useMemo(() => {
        if (expenses.length === 0) return [];
        const allDates = expenses.map(e => e.date || "2026-11-14").sort();
        const firstDateObj = new Date(allDates[0] + "T00:00:00");

        const groupsMap = {};
        expenses.forEach(exp => {
          const dStr = exp.date || new Date().toISOString().split("T")[0];
          if (!groupsMap[dStr]) {
            const curDateObj = new Date(dStr + "T00:00:00");
            const diffDays = Math.round((curDateObj - firstDateObj) / (1000 * 60 * 60 * 24)) + 1;
            const shortDate = dStr.slice(5).replace("-", "/");
            groupsMap[dStr] = {
              date: dStr,
              shortDate,
              dayNum: diffDays > 0 ? diffDays : 1,
              items: [],
              dayTotalHKD: 0
            };
          }
          groupsMap[dStr].items.push(exp);
          if (exp.type !== "pool_topup") {
            groupsMap[dStr].dayTotalHKD += toHKD(Number(exp.amount), exp.currency);
          }
        });

        return Object.values(groupsMap).sort((a, b) => b.date.localeCompare(a.date));
      }, [expenses, rates]);

      // 結算演算法
      const settlement = useMemo(() => {
        const balances = {};
        const personalConsumption = {};
        members.forEach(m => {
          balances[m] = 0;
          personalConsumption[m] = 0;
        });

        expenses.forEach(exp => {
          const hkdAmount = toHKD(Number(exp.amount), exp.currency);

          if (exp.type === "pool_topup") {
            const contribs = (exp.contributors || exp.splitWith || []).filter(p => balances[p] !== undefined);
            if (contribs.length > 0) {
              const eachCredit = hkdAmount / contribs.length;
              contribs.forEach(p => {
                balances[p] += eachCredit;
              });
            }
            return;
          }

          const rawShares = getExpenseMemberShares(exp);
          const validSplits = Object.keys(rawShares).filter(p => balances[p] !== undefined);
          if (validSplits.length === 0) return;

          if (exp.payer !== POOL_PAYER_KEY && balances[exp.payer] !== undefined) {
            balances[exp.payer] += hkdAmount;
          }

          validSplits.forEach(p => {
            const shareHKD = toHKD(rawShares[p] || 0, exp.currency);
            balances[p] -= shareHKD;
            personalConsumption[p] = (personalConsumption[p] || 0) + shareHKD;
          });
        });

        const debtors = [];
        const creditors = [];

        Object.keys(balances).forEach(m => {
          const val = Math.round(balances[m]);
          if (val < -1) debtors.push({ name: m, amount: -val });
          else if (val > 1) creditors.push({ name: m, amount: val });
        });

        debtors.sort((a, b) => b.amount - a.amount);
        creditors.sort((a, b) => b.amount - a.amount);

        const transactions = [];
        let i = 0, j = 0;
        while (i < debtors.length && j < creditors.length) {
          const deb = debtors[i];
          const cred = creditors[j];
          const settleAmt = Math.min(deb.amount, cred.amount);

          transactions.push({
            from: deb.name,
            to: cred.name,
            amount: Math.round(settleAmt)
          });

          deb.amount -= settleAmt;
          cred.amount -= settleAmt;

          if (deb.amount === 0) i++;
          if (cred.amount === 0) j++;
        }

        const spenderLeaderboard = Object.keys(personalConsumption)
          .map(name => ({ name, spentHKD: Math.round(personalConsumption[name]) }))
          .sort((a, b) => b.spentHKD - a.spentHKD);

        return { balances, transactions, spenderLeaderboard };
      }, [expenses, members, rates]);

      // 旅行消費分類佔比統計
      const categoryChartData = useMemo(() => {
        const map = {};
        realExpenses.forEach(exp => {
          const cat = exp.category || "雜項";
          const hkd = toHKD(Number(exp.amount), exp.currency);
          map[cat] = (map[cat] || 0) + hkd;
        });
        const list = Object.keys(map)
          .map(cat => ({
            category: cat,
            hkd: map[cat],
            percent: totalHKD > 0 ? Math.round((map[cat] / totalHKD) * 100) : 0,
            meta: CATEGORY_META[cat] || CATEGORY_META["雜項"]
          }))
          .sort((a, b) => b.hkd - a.hkd);
        return list;
      }, [realExpenses, totalHKD, rates]);

      // 一鍵匯出 Excel (.csv) 完整帳目報表
      const exportToExcelCSV = () => {
        if (expenses.length === 0) {
          alert("目前未有任何帳目可以匯出！");
          return;
        }
        const headers = [
          "日期",
          "類型",
          "項目名稱",
          "分類",
          "原幣",
          "原幣金額",
          "當日匯率(兌HKD)",
          "折合港幣(HKD)",
          "墊支/付款方式",
          "分帳模式",
          "參與分攤成員",
          ...members.map(m => `${m} 應付(HKD)`)
        ];

        const escapeCSV = (val) => {
          const str = String(val ?? "");
          if (str.includes(",") || str.includes('"') || str.includes("\n")) {
            return `"${str.replace(/"/g, '""')}"`;
          }
          return str;
        };

        const rows = [...expenses]
          .sort((a, b) => (a.date || "").localeCompare(b.date || ""))
          .map(exp => {
            const cur = exp.currency || "HKD";
            const rate = rates[cur] || 1;
            const hkdTotal = Math.round(toHKD(Number(exp.amount), cur));
            const payerLabel = exp.type === "pool_topup"
              ? "公數注資"
              : exp.payer === POOL_PAYER_KEY
              ? "公數錢包支付"
              : exp.payer;
            const modeLabel = exp.type === "pool_topup"
              ? "注資"
              : exp.splitMode === "custom"
              ? "不等額逐項計"
              : "平均分攤";

            const shares = getExpenseMemberShares(exp);
            const memberCols = members.map(m => {
              if (exp.type === "pool_topup") {
                return (exp.contributors || []).includes(m)
                  ? Math.round(hkdTotal / (exp.contributors.length || 1))
                  : 0;
              }
              const s = shares[m] || 0;
              return Math.round(toHKD(s, cur));
            });

            return [
              exp.date || "",
              exp.type === "pool_topup" ? "公數注資" : "一般開支",
              exp.title || "",
              exp.category || "",
              cur,
              exp.amount || 0,
              rate,
              hkdTotal,
              payerLabel,
              modeLabel,
              (exp.splitWith || []).join(" / "),
              ...memberCols
            ].map(escapeCSV).join(",");
          });

        const csvContent = "\uFEFF" + [headers.map(escapeCSV).join(","), ...rows].join("\n");
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        const safeTrip = (tripName || "TripTab").replace(/[\\/:*?"<>|]/g, "_");
        link.href = url;
        link.setAttribute("download", `${safeTrip}_完整帳目報表_${roomId}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      };

      const shareRoomLink = () => {
        const shareUrl = `${window.location.origin}${window.location.pathname}?room=${encodeURIComponent(roomId)}`;
        const msg = `✈️ 一齊用 TripTab 記低「${tripName}」旅行夾錢開支！\n🔑 房間代碼：${roomId}\n👉 直接撳連結自動入房：\n${shareUrl}`;
        if (navigator.share) {
          navigator.share({ title: `TripTab - ${tripName}`, text: msg }).catch(() => {});
        } else {
          navigator.clipboard.writeText(msg);
          alert(`已複製邀請連結！直接貼去 WhatsApp 群組，朋友一撳就會自動入房「${roomId}」📲`);
        }
      };

      const shareCleanApp = () => {
        const cleanUrl = `${window.location.origin}${window.location.pathname}`;
        const msg = `✈️ 推薦呢個超好用嘅旅行夾錢記帳 App「TripTab」！支援多國即時匯率、公數錢包同自動計數：\n${cleanUrl}`;
        if (navigator.share) {
          navigator.share({ title: "TripTab - 旅行夾錢記帳 App", text: msg }).catch(() => {});
        } else {
          navigator.clipboard.writeText(msg);
          alert(`已複製乾淨嘅 TripTab 推薦連結！`);
        }
      };

      const copyToWhatsApp = () => {
        let text = `✈️ TripTab【${tripName}】結算清單 📊\n`;
        text += `房號：${roomId} ｜ 總實際消費：HK$ ${Math.round(totalHKD).toLocaleString()}\n`;
        if (poolSummary.hasActivity) {
          const poolStrs = Object.entries(poolSummary.byCurrency).map(([c, obj]) => `${c} ${Math.round(obj.balance).toLocaleString()}`);
          text += `👛 公數錢包結餘：${poolStrs.join(" / ")}\n`;
        }
        text += `------------------------\n`;
        text += `【過數指引 / FPS / PayMe (已連公數多除少補)】：\n`;
        if (settlement.transactions.length === 0) {
          text += `✅ 大家帳目已平衡，互不相欠！\n`;
        } else {
          settlement.transactions.forEach(t => {
            text += `👉 ${t.from} 需過數 HK$ ${t.amount.toLocaleString()} 畀 ${t.to}\n`;
          });
        }
        text += `------------------------\n`;
        text += `大家 check 下有冇問題！🍻`;
        navigator.clipboard.writeText(text);
        alert("已複製 WhatsApp 結算清單！");
      };

      // SVG 圓餅圖計算
      const renderDonutChart = () => {
        if (categoryChartData.length === 0 || totalHKD <= 0) return null;
        const radius = 52;
        const circumference = 2 * Math.PI * radius;
        let accumulatedPercent = 0;

        return (
          <div className="flex items-center gap-5 py-2">
            <div className="relative w-36 h-36 flex-shrink-0 flex items-center justify-center">
              <svg className="w-36 h-36 -rotate-90" viewBox="0 0 140 140">
                <circle cx="70" cy="70" r={radius} fill="none" stroke="#F1F5F9" strokeWidth="18" />
                {categoryChartData.map((item, idx) => {
                  const pct = item.hkd / totalHKD;
                  const strokeDasharray = `${pct * circumference} ${circumference}`;
                  const strokeDashoffset = -accumulatedPercent * circumference;
                  accumulatedPercent += pct;
                  return (
                    <circle
                      key={idx}
                      cx="70"
                      cy="70"
                      r={radius}
                      fill="none"
                      stroke={item.meta.color}
                      strokeWidth="18"
                      strokeDasharray={strokeDasharray}
                      strokeDashoffset={strokeDashoffset}
                      strokeLinecap="butt"
                    />
                  );
                })}
              </svg>
              <div className="absolute inset-0 flex flex-col items-center justify-center text-center px-2">
                <span className="text-[10px] font-bold text-slate-400">總消費</span>
                <span className="text-xs font-black text-slate-800">HK${Math.round(totalHKD).toLocaleString()}</span>
              </div>
            </div>

            <div className="flex-1 space-y-1.5 min-w-0">
              {categoryChartData.map(item => (
                <div key={item.category} className="flex items-center justify-between text-xs">
                  <div className="flex items-center gap-1.5 truncate">
                    <span className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{ backgroundColor: item.meta.color }}></span>
                    <span className="font-bold text-slate-700 truncate">{item.meta.icon} {item.category}</span>
                  </div>
                  <div className="text-right flex-shrink-0 ml-2">
                    <span className="font-extrabold text-slate-800">{item.percent}%</span>
                    <span className="text-[10px] text-slate-400 ml-1">(${Math.round(item.hkd).toLocaleString()})</span>
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      };

      return (
        <div className="max-w-md mx-auto min-h-screen bg-[#EFF6F2] flex flex-col shadow-2xl relative overflow-x-hidden pb-28 sm:my-4 sm:rounded-[42px] border border-white/60">
          
          {/* 頂部大自然森林湖景插畫區 */}
          <div className="relative pt-6 pb-20 px-6 overflow-hidden">
            <svg className="absolute inset-0 w-full h-full object-cover pointer-events-none" viewBox="0 0 400 285" preserveAspectRatio="xMidYMid slice">
              <defs>
                <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#E3F3EC" />
                  <stop offset="55%" stopColor="#F5F9EB" />
                  <stop offset="100%" stopColor="#D7EDD9" />
                </linearGradient>
                <linearGradient id="lakeGrad" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0%" stopColor="#B8E2D8" />
                  <stop offset="50%" stopColor="#E2F4EB" />
                  <stop offset="100%" stopColor="#9ACBBC" />
                </linearGradient>
              </defs>
              <rect width="400" height="285" fill="url(#skyGrad)" />
              <circle cx="255" cy="95" r="34" fill="#FFFDF2" opacity="0.95" />
              <circle cx="255" cy="95" r="55" fill="#FFFDF2" opacity="0.35" />
              <path d="M-20 190 Q85 115 210 175 T420 145 L420 285 L-20 285 Z" fill="#C2DEC8" opacity="0.7" />
              <path d="M130 195 Q275 115 420 165 L420 285 L130 285 Z" fill="#9DC4A7" opacity="0.85" />
              <path d="M-20 145 Q90 130 185 205 L-20 240 Z" fill="#78AA82" />
              <path d="M70 205 L420 190 L420 265 L40 265 Z" fill="url(#lakeGrad)" />
              <ellipse cx="250" cy="215" rx="55" ry="3" fill="#FFFFFF" opacity="0.65" />
              <ellipse cx="235" cy="226" rx="35" ry="2" fill="#FFFFFF" opacity="0.5" />
              <path d="M-20 195 Q115 190 220 260 L-20 285 Z" fill="#518763" />
              <path d="M250 245 Q335 205 420 220 L420 285 L210 285 Z" fill="#467A57" />
              <path d="M0 78 Q55 68 115 98" stroke="#3E6E4C" strokeWidth="2" fill="none" opacity="0.65" />
              <ellipse cx="32" cy="76" rx="11" ry="4.5" transform="rotate(-18 32 76)" fill="#588E67" opacity="0.8" />
              <ellipse cx="64" cy="81" rx="12" ry="4.5" transform="rotate(12 64 81)" fill="#437652" opacity="0.8" />
              <ellipse cx="95" cy="91" rx="10" ry="4" transform="rotate(25 95 91)" fill="#6FA47C" opacity="0.85" />
              <ellipse cx="48" cy="89" rx="9" ry="3.5" transform="rotate(-28 48 89)" fill="#6FA47C" opacity="0.75" />
            </svg>

            <div className="relative z-10 flex justify-between items-start gap-2">
              <div className="flex items-center gap-3">
                <TripTabLogo className="w-12 h-12" />
                <div>
                  <div className="flex items-center gap-1.5">
                    <span className="text-[11px] font-extrabold tracking-widest uppercase text-[#3D6B52]">
                      TRIPTAB PRO
                    </span>
                    <span
                      className={`w-2 h-2 rounded-full ${!isOnline ? 'bg-amber-500' : syncStatus === 'synced' ? 'bg-emerald-500' : 'bg-amber-400 animate-ping'}`}
                      title={!isOnline ? "離線記帳模式 (有網自動同步)" : "雲端同步正常"}
                    ></span>
                    {!isOnline && (
                      <span className="text-[10px] bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded font-bold">
                        離線記帳中
                      </span>
                    )}
                  </div>
                  <h1 className="text-2xl font-black text-slate-800 tracking-tight leading-tight">
                    {tripName}
                  </h1>
                  <p className="text-xs text-slate-600 font-medium mt-0.5">
                    Smart Travel Split • {members.length} 位同行成員
                  </p>
                </div>
              </div>

              <div className="flex flex-col items-end gap-1.5 flex-shrink-0">
                <span className="bg-white/85 backdrop-blur-md border border-slate-200/80 text-slate-700 text-xs font-mono font-bold px-3 py-1.5 rounded-full shadow-sm">
                  #{roomId}
                </span>
                <button
                  type="button"
                  onClick={() => fetchLiveRatesFromAPI(false)}
                  className="text-[10px] text-slate-600 bg-white/70 hover:bg-white px-2 py-0.5 rounded-full font-medium flex items-center gap-1 shadow-2xs transition"
                  title="點擊更新即時匯率"
                >
                  <span>🔄 匯率 {rateUpdatedText}</span>
                </button>
              </div>
            </div>
          </div>

          {/* 懸浮白色總覽卡片 */}
          <div className="px-5 -mt-12 relative z-20">
            <div className="bg-white rounded-[26px] p-4 shadow-lg shadow-emerald-950/5 border border-emerald-50">
              <div className="flex items-center justify-between gap-2">
                <div className="flex items-center gap-3.5 min-w-0">
                  <div className="w-12 h-12 rounded-full bg-[#529B6A] text-white flex items-center justify-center shadow-sm flex-shrink-0">
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2.8" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
                    </svg>
                  </div>
                  <div className="min-w-0">
                    <p className="text-xs font-semibold text-slate-400">旅程總消費折合 (HKD)</p>
                    <p className="text-2xl font-black text-slate-800 tracking-tight truncate">
                      HK$ {Math.round(totalHKD).toLocaleString()}
                    </p>

            </button>

            <button onClick={() => setActiveTab("rates")} className="flex flex-col items-center py-1 px-3 relative group">
              <svg className={`w-6 h-6 transition ${activeTab === 'rates' ? 'text-[#3D7A5A]' : 'text-slate-400'}`} fill="none" stroke="currentColor" strokeWidth="2.2" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" d="M6 20v-5M12 20v-9M18 20V6" />
              </svg>
              <span className={`text-[10px] font-bold mt-0.5 ${activeTab === 'rates' ? 'text-[#3D7A5A]' : 'text-slate-400'}`}>匯率</span>
              {activeTab === "rates" && <span className="w-1.5 h-1.5 rounded-full bg-[#3D7A5A] mt-0.5"></span>}
            </button>
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
