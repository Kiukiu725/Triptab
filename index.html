<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>TripTab - 旅行夾錢記帳 App</title>
  
  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="TripTab" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#E6F2EC" />

  <!-- App Logo 設定 -->
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="icon" type="image/png" href="icon.png" />

  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase Compat SDKs (App + Realtime Database) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      background-color: #DCE7E1;
      background-image: 
        radial-gradient(at 10% 10%, rgba(164, 198, 174, 0.45) 0px, transparent 50%),
        radial-gradient(at 90% 85%, rgba(132, 172, 146, 0.4) 0px, transparent 55%);
    }
    input, select, textarea {
      user-select: auto;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // 初始化 Firebase
    const firebaseConfig = {
      databaseURL: "https://travel-split-app-78a36-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    const DEFAULT_RATES = {
      HKD: 1.0,
      JPY: 0.052,
      TWD: 0.245,
      SGD: 5.82,
      KRW: 0.0058,
      THB: 0.22,
      EUR: 8.45,
      GBP: 9.95,
      USD: 7.78,
      AUD: 5.15,
      CNY: 1.08,
      MOP: 0.97,
      CAD: 5.75,
      CHF: 8.85,
      VND: 0.00031
    };

    const DEFAULT_MEMBERS = ["我", "老公", "奶奶", "老爺", "叔仔"];
    const POOL_PAYER_KEY = "__POOL__";

    const DEFAULT_CATEGORIES = [
      { name: "餐飲", icon: "🍱" },
      { name: "交通", icon: "🚗" },
      { name: "住宿", icon: "🏨" },
      { name: "門票", icon: "🎟️" },
      { name: "購物", icon: "🛍️" },
      { name: "機票", icon: "✈️" },
      { name: "雜項", icon: "💡" }
    ];

    const PALETTE_STYLES = [
      { bg: "bg-emerald-100 text-emerald-700", color: "#34D399" },
      { bg: "bg-blue-100 text-blue-700", color: "#60A5FA" },
      { bg: "bg-amber-100 text-amber-700", color: "#FBBF24" },
      { bg: "bg-purple-100 text-purple-700", color: "#A78BFA" },
      { bg: "bg-rose-100 text-rose-700", color: "#FB7185" },
      { bg: "bg-cyan-100 text-cyan-700", color: "#22D3EE" },
      { bg: "bg-indigo-100 text-indigo-700", color: "#818CF8" },
      { bg: "bg-orange-100 text-orange-700", color: "#FB923C" },
      { bg: "bg-lime-100 text-lime-700", color: "#A3E635" },
      { bg: "bg-slate-100 text-slate-700", color: "#94A3B8" }
    ];

    const generateRoomCode = () => {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let result = "";
      for (let i = 0; i < 6; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    };

    const sanitizeRoomId = (raw) => {
      return (raw || "").trim().toUpperCase().replace(/[.#$\[\]\/]/g, "-");
    };

    const getInitialRoom = () => {
      const params = new URLSearchParams(window.location.search);
      const urlRoom = params.get("room");
      if (urlRoom && sanitizeRoomId(urlRoom)) return sanitizeRoomId(urlRoom);
      const saved = localStorage.getItem("last_travel_room");
      if (saved && sanitizeRoomId(saved)) return sanitizeRoomId(saved);
      const newRandomCode = generateRoomCode();
      localStorage.setItem("last_travel_room", newRandomCode);
      return newRandomCode;
    };

    const getInitialSavedRooms = () => {
      try {
        const raw = localStorage.getItem("triptab_saved_rooms");
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) return parsed;
        }
      } catch (e) {}
      return [];
    };

    const TripTabLogo = ({ className = "w-11 h-11" }) => {
      const [imgErr, setImgErr] = useState(false);
      if (!imgErr) {
        return (
          <img
            src="icon.png"
            alt="TripTab Logo"
            onError={() => setImgErr(true)}
            className={`${className} rounded-2xl shadow-sm object-cover flex-shrink-0`}
          />
        );
      }
      return (
        <svg viewBox="0 0 120 120" className={`${className} rounded-2xl shadow-sm flex-shrink-0`}>
          <rect width="120" height="120" rx="28" fill="#6F8C74" />
          <path d="M60 36 C58 22, 76 16, 77 25 C78 33, 62 34, 60 40" fill="none" stroke="#DFC3A4" strokeWidth="3.5" strokeLinecap="round" />
          <path d="M48 32 L72 32 L82 44 L82 94 L75 88 L68 94 L60 88 L52 94 L45 88 L38 94 L38 44 Z" fill="#F9EFE1" />
          <path d="M60 32 L72 32 L82 44 L82 94 L75 88 L68 94 L60 88 Z" fill="#EFE0CA" opacity="0.65" />
          <circle cx="60" cy="42" r="6" fill="#6F8C74" stroke="#D7B899" strokeWidth="3" />
          <line x1="60" y1="53" x2="60" y2="85" stroke="#6F8C74" strokeWidth="2.5" strokeDasharray="4 4" strokeLinecap="round" />
          <line x1="42" y1="77" x2="76" y2="77" stroke="#6F8C74" strokeWidth="2.5" strokeDasharray="4 4" strokeLinecap="round" />
          <path d="M46 68 L53 64 L55 66 L51 71 L53 74 L51 75 L48 72 L45 73 L44 72 L46 70 Z" fill="#D5B696" />
          <path d="M70 53 L71.5 56.5 L75 58 L71.5 59.5 L70 63 L68.5 59.5 L65 58 L68.5 56.5 Z" fill="#D5B696" />
          <circle cx="74" cy="74" r="2.2" fill="none" stroke="#6F8C74" strokeWidth="1.8" />
          <circle cx="74" cy="80" r="2.2" fill="none" stroke="#6F8C74" strokeWidth="1.8" />
          <line x1="68" y1="79" x2="72.5" y2="75" stroke="#6F8C74" strokeWidth="1.8" strokeLinecap="round" />
          <line x1="68" y1="75" x2="72.5" y2="79" stroke="#6F8C74" strokeWidth="1.8" strokeLinecap="round" />
        </svg>
      );
    };

    function App() {
      const [roomId, setRoomId] = useState(getInitialRoom);
      const [savedRooms, setSavedRooms] = useState(getInitialSavedRooms);
      const [roomInput, setRoomInput] = useState("");
      const [newRoomCustomName, setNewRoomCustomName] = useState("");
      const [syncStatus, setSyncStatus] = useState("connecting");
      const [isOnline, setIsOnline] = useState(navigator.onLine);

      // 雲端同步狀態
      const [tripName, setTripName] = useState("新旅程記帳 ✈️");
      const [members, setMembers] = useState(DEFAULT_MEMBERS);
      const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
      const [expenses, setExpenses] = useState([]);
      const [customRates, setCustomRates] = useState({});
      const [defaultCurrency, setDefaultCurrency] = useState("JPY");
      const [settledMarks, setSettledMarks] = useState({});
      // 新增：海外信用卡手續費 (%) 設定（預設香港常見 1.95%）
      const [cardFeePct, setCardFeePct] = useState(1.95);

      // UI 狀態
      const [activeTab, setActiveTab] = useState("expenses");
      const [showAddForm, setShowAddForm] = useState(false);
      const [showPoolModal, setShowPoolModal] = useState(false);
      const [editingExpense, setEditingExpense] = useState(null);
      const [expenseToDelete, setExpenseToDelete] = useState(null);
      const [collapsedDays, setCollapsedDays] = useState({});

      const [renamingMember, setRenamingMember] = useState(null);
      const [renameInputVal, setRenameInputVal] = useState("");

      const [newMemberName, setNewMemberName] = useState("");
      const [newCatIcon, setNewCatIcon] = useState("✨");
      const [newCatName, setNewCatName] = useState("");

      const [liveRates, setLiveRates] = useState(DEFAULT_RATES);
      const [rateUpdatedText, setRateUpdatedText] = useState("載入中...");
      const [isRefreshingRates, setIsRefreshingRates] = useState(false);
      const [newCurCode, setNewCurCode] = useState("");
      const [newCurRate, setNewCurRate] = useState("");

      // 新增開支表單狀態
      const [title, setTitle] = useState("");
      const [amount, setAmount] = useState("");
      const [currency, setCurrency] = useState("JPY");
      const [payer, setPayer] = useState("我");
      const [splitWith, setSplitWith] = useState(DEFAULT_MEMBERS);
      const [category, setCategory] = useState("餐飲");
      const [expDate, setExpDate] = useState(() => new Date().toISOString().split("T")[0]);
      const [splitMode, setSplitMode] = useState("equal");
      const [customSplitsInput, setCustomSplitsInput] = useState({});
      const [includeCardFee, setIncludeCardFee] = useState(false); // 新增開支時是否計入信用卡手續費

      // 公數錢包注資表單狀態
      const [poolPerPersonAmt, setPoolPerPersonAmt] = useState("10000");
      const [poolCurrency, setPoolCurrency] = useState("JPY");
      const [poolContributors, setPoolContributors] = useState(DEFAULT_MEMBERS);
      const [poolNote, setPoolNote] = useState("公數錢包注資");
      const [poolDate, setPoolDate] = useState(() => new Date().toISOString().split("T")[0]);

      // 更新並儲存「我的房間列表」至本機
      const upsertSavedRoom = (id, name) => {
        if (!id) return;
        setSavedRooms(prev => {
          const exists = prev.find(r => r.id === id);
          let next;
          if (exists) {
            next = prev.map(r => r.id === id ? { ...r, name: name || r.name, updatedAt: Date.now() } : r);
          } else {
            next = [{ id, name: name || "新旅程記帳 ✈️", updatedAt: Date.now() }, ...prev];
          }
          localStorage.setItem("triptab_saved_rooms", JSON.stringify(next));
          return next;
        });
      };

      const removeSavedRoomFromList = (id, e) => {
        e.stopPropagation();
        if (id === roomId) return;
        if (!window.confirm(`確定要從「我的房間列表」移除 #${id} 嗎？（雲端資料唔會被刪除，日後仍可憑代碼入返）`)) return;
        setSavedRooms(prev => {
          const next = prev.filter(r => r.id !== id);
          localStorage.setItem("triptab_saved_rooms", JSON.stringify(next));
          return next;
        });
      };

      const getCategoryMeta = (catName) => {
        if (catName === "公數注資") {
          return { icon: "👛", bg: "bg-teal-100 text-teal-800", color: "#14B8A6" };
        }
        const idx = categories.findIndex(c => c.name === catName);
        if (idx !== -1) {
          const style = PALETTE_STYLES[idx % PALETTE_STYLES.length];
          return { icon: categories[idx].icon || "💡", bg: style.bg, color: style.color };
        }
        return { icon: "💡", bg: "bg-slate-100 text-slate-700", color: "#94A3B8" };
      };

      const rates = useMemo(() => {
        return { ...liveRates, ...customRates };
      }, [liveRates, customRates]);

      const sortedCurrencies = useMemo(() => {
        const allKeys = Object.keys(rates);
        return allKeys.sort((a, b) => {
          if (a === defaultCurrency) return -1;
          if (b === defaultCurrency) return 1;
          return 0;
        });
      }, [rates, defaultCurrency]);

      useEffect(() => {
        const handleOnline = () => setIsOnline(true);
        const handleOffline = () => setIsOnline(false);
        window.addEventListener("online", handleOnline);
        window.addEventListener("offline", handleOffline);
        return () => {
          window.removeEventListener("online", handleOnline);
          window.removeEventListener("offline", handleOffline);
        };
      }, []);

      const fetchLiveRatesFromAPI = (resetCustom = false) => {
        setIsRefreshingRates(true);
        return fetch("https://open.er-api.com/v6/latest/HKD")
          .then(res => res.json())
          .then(data => {
            if (data && data.rates) {
              const updated = {};
              const allKnownCodes = new Set([...Object.keys(DEFAULT_RATES), ...Object.keys(customRates)]);
              allKnownCodes.forEach(cur => {
                if (cur === "HKD") {
                  updated[cur] = 1.0;
                } else if (data.rates[cur]) {
                  updated[cur] = Number((1 / data.rates[cur]).toFixed(5));
                } else if (DEFAULT_RATES[cur]) {
                  updated[cur] = DEFAULT_RATES[cur];
                }
              });
              setLiveRates(prev => ({ ...prev, ...updated }));
              const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
              setRateUpdatedText(timeStr);

              if (resetCustom) {
                const remainingCustom = {};
                Object.keys(customRates).forEach(code => {
                  if (!data.rates[code] && code !== "HKD") {
                    remainingCustom[code] = customRates[code];
                  }
                });
                db.ref(`rooms/${roomId}/customRates`).set(remainingCustom);
              }
            }
          })
          .catch(() => {
            setRateUpdatedText("離線基準");
          })
          .finally(() => {
            setIsRefreshingRates(false);
          });
      };

      useEffect(() => {
        fetchLiveRatesFromAPI(false);
      }, []);

      // 監聽 Firebase 房間資料
      useEffect(() => {
        setSyncStatus("connecting");
        localStorage.setItem("last_travel_room", roomId);

        const cachedStr = localStorage.getItem(`triptab_cache_${roomId}`);
        if (cachedStr) {
          try {
            const cached = JSON.parse(cachedStr);
            if (cached.tripName) {
              setTripName(cached.tripName);
              upsertSavedRoom(roomId, cached.tripName);
            }
            if (Array.isArray(cached.members)) setMembers(cached.members);
            if (Array.isArray(cached.categories) && cached.categories.length > 0) setCategories(cached.categories);
            if (Array.isArray(cached.expenses)) setExpenses(cached.expenses);
            if (cached.customRates) setCustomRates(cached.customRates);
            if (cached.settledMarks) setSettledMarks(cached.settledMarks);
            if (cached.cardFeePct !== undefined) setCardFeePct(Number(cached.cardFeePct));
            if (cached.defaultCurrency) {
              setDefaultCurrency(cached.defaultCurrency);
              setCurrency(cached.defaultCurrency);
              setPoolCurrency(cached.defaultCurrency);
            }
          } catch (e) {}
        }

        const url = new URL(window.location);
        url.searchParams.set("room", roomId);
        window.history.replaceState({}, "", url);

        const roomRef = db.ref(`rooms/${roomId}`);

        const handleValue = (snapshot) => {
          const data = snapshot.val();
          if (data) {
            const tName = data.tripName || "新旅程記帳 ✈️";
            const loadedMembers = Array.isArray(data.members) && data.members.length > 0 ? data.members : DEFAULT_MEMBERS;
            const loadedCategories = Array.isArray(data.categories) && data.categories.length > 0 ? data.categories : DEFAULT_CATEGORIES;
            const expList = data.expenses ? Object.values(data.expenses).sort((a, b) => (b.id || 0) - (a.id || 0)) : [];
            const cRates = data.customRates || {};
            const defCur = data.defaultCurrency || "JPY";
            const sMarks = data.settledMarks || {};
            const cFee = data.cardFeePct !== undefined ? Number(data.cardFeePct) : 1.95;

            setTripName(tName);
            upsertSavedRoom(roomId, tName);
            setMembers(loadedMembers);
            setCategories(loadedCategories);
            setCategory(prev => loadedCategories.some(c => c.name === prev) ? prev : loadedCategories[0].name);
            setPayer(prev => (prev === POOL_PAYER_KEY || loadedMembers.includes(prev)) ? prev : loadedMembers[0]);
            setSplitWith(prev => {
              const valid = prev.filter(m => loadedMembers.includes(m));
              return valid.length > 0 ? valid : loadedMembers;
            });
            setPoolContributors(loadedMembers);
            setExpenses(expList);
            setCustomRates(cRates);
            setDefaultCurrency(defCur);
            setCurrency(defCur);
            setPoolCurrency(defCur);
            setSettledMarks(sMarks);
            setCardFeePct(cFee);

            localStorage.setItem(`triptab_cache_${roomId}`, JSON.stringify({
              tripName: tName,
              members: loadedMembers,
              categories: loadedCategories,
              expenses: expList,
              customRates: cRates,
              defaultCurrency: defCur,
              settledMarks: sMarks,
              cardFeePct: cFee
            }));
          } else {
            const initialRoomData = {
              tripName: "新旅程記帳 ✈️",
              members: DEFAULT_MEMBERS,
              categories: DEFAULT_CATEGORIES,
              expenses: {},
              customRates: {},
              settledMarks: {},
              defaultCurrency: "JPY",
              cardFeePct: 1.95,
              createdAt: Date.now()
            };
            roomRef.set(initialRoomData);
            upsertSavedRoom(roomId, "新旅程記帳 ✈️");
          }
          setSyncStatus("synced");
        };

        const handleError = (err) => {
          console.error("Firebase error:", err);
          setSyncStatus("error");
        };

        roomRef.on("value", handleValue, handleError);
        return () => roomRef.off("value", handleValue);
      }, [roomId]);

      const handleSelectDefaultCurrency = (cur) => {
        setDefaultCurrency(cur);
        setCurrency(cur);
        setPoolCurrency(cur);
        db.ref(`rooms/${roomId}/defaultCurrency`).set(cur);
      };

      // 更新海外信用卡手續費 (%) 設定並同步至雲端
      const handleCardFeeChange = (val) => {
        const num = parseFloat(val);
        const cleanFee = isNaN(num) || num < 0 ? 0 : num;
        setCardFeePct(val);
        if (!isNaN(num) && num >= 0) {
          db.ref(`rooms/${roomId}/cardFeePct`).set(cleanFee);
        }
      };

      // 按右邊 ✓ 號標記已付，文字會自動消除
      const markTransactionAsPaid = (from, to) => {
        const key = `${from}__TO__${to}`.replace(/[.#$\[\]\/]/g, "_");
        setSettledMarks(prev => ({ ...prev, [key]: true }));
        db.ref(`rooms/${roomId}/settledMarks/${key}`).set(true);
      };

      const resetAllSettledMarks = () => {
        setSettledMarks({});
        db.ref(`rooms/${roomId}/settledMarks`).remove();
      };

      // 折算港幣函數（支援計入海外信用卡手續費 %）
      const toHKD = (amt, curr, feePct = 0) => {
        const r = rates[curr] || 1;
        const baseHKD = (Number(amt) || 0) * r;
        if (curr !== "HKD" && feePct > 0) {
          return baseHKD * (1 + Number(feePct) / 100);
        }
        return baseHKD;
      };

      // 取得單筆帳目實際適用嘅信用卡手續費 %
      const getExpFeePct = (exp) => {
        if (!exp || exp.type === "pool_topup" || exp.currency === "HKD" || exp.payer === POOL_PAYER_KEY) return 0;
        if (exp.hasCardFee) {
          return exp.cardFeePct !== undefined ? Number(exp.cardFeePct) : (Number(cardFeePct) || 0);
        }
        return 0;
      };

      const getExpHKD = (exp) => {
        return toHKD(exp.amount, exp.currency, getExpFeePct(exp));
      };

      const poolSummary = useMemo(() => {
        const byCurrency = {};
        let totalTopUpHKD = 0;
        let totalSpentFromPoolHKD = 0;

        expenses.forEach(exp => {
          const cur = exp.currency || "HKD";
          const amt = Number(exp.amount) || 0;
          if (exp.type === "pool_topup") {
            if (!byCurrency[cur]) byCurrency[cur] = { topup: 0, spent: 0, balance: 0 };
            byCurrency[cur].topup += amt;
            byCurrency[cur].balance += amt;
            totalTopUpHKD += toHKD(amt, cur, 0);
          } else if (exp.payer === POOL_PAYER_KEY) {
            if (!byCurrency[cur]) byCurrency[cur] = { topup: 0, spent: 0, balance: 0 };
            byCurrency[cur].spent += amt;
            byCurrency[cur].balance -= amt;
            totalSpentFromPoolHKD += toHKD(amt, cur, 0);
          }
        });

        const remainHKD = totalTopUpHKD - totalSpentFromPoolHKD;
        return {
          byCurrency,
          totalTopUpHKD,
          totalSpentFromPoolHKD,
          remainHKD,
          hasActivity: Object.keys(byCurrency).length > 0
        };
      }, [expenses, rates]);

      const currentCurrencyPoolBalance = useMemo(() => {
        return poolSummary.byCurrency[currency]?.balance || 0;
      }, [poolSummary, currency]);

      const isPoolInsufficient = useMemo(() => {
        if (payer !== POOL_PAYER_KEY) return false;
        const numAmt = parseFloat(amount) || 0;
        return currentCurrencyPoolBalance <= 0 || numAmt > currentCurrencyPoolBalance + 0.0001;
      }, [payer, amount, currentCurrencyPoolBalance]);

      const getExpenseMemberShares = (exp) => {
        const total = Number(exp.amount) || 0;
        const rawSplits = Array.isArray(exp.splitWith) && exp.splitWith.length > 0 ? exp.splitWith : [];
        const activeSplits = rawSplits.filter(m => members.includes(m));
        const splits = activeSplits.length > 0 ? activeSplits : members;
        const shares = {};
        if (splits.length === 0) return shares;

        if (exp.splitMode === "custom" && exp.customSplits) {
          let specifiedSum = 0;
          const unspecifiedMembers = [];
          splits.forEach(m => {
            const val = exp.customSplits[m];
            if (val !== undefined && val !== "" && !isNaN(Number(val))) {
              const num = Number(val);
              shares[m] = num;
              specifiedSum += num;
            } else {
              unspecifiedMembers.push(m);
            }

            });

      const groupedDays = useMemo(() => {

        const allDates = expenses.map(e => e.date || "2026-11-14").sort();
        const firstDateObj = new Date(allDates[0] + "T00:00:00");

        const groupsMap = {};
        expenses.forEach(exp => {

          if (!groupsMap[dStr]) {

            const shortDate = dStr.slice(5).replace("-", "/");
            groupsMap[dStr] = {

              dayTotalHKD: 0
            };
          }
          groupsMap[dStr].items.push(exp);

      // 結算演算法 (自動計入海外信用卡手續費 + 打 Tick 消除項目)
      const settlement = useMemo(() => {
        const balances = {};
        const removedPayerNegativeBalances = {};
        const personalConsumption = {};

        members.forEach(m => {
          balances[m] = 0;
          personalConsumption[m] = 0;
        });

        expenses.forEach(exp => {
          const feePct = getExpFeePct(exp);
          const hkdAmount = toHKD(Number(exp.amount), exp.currency, feePct);

          if (exp.type === "pool_topup") {
            const activeContribs = (exp.contributors || exp.splitWith || []).filter(p => members.includes(p));
            const contribs = activeContribs.length > 0 ? activeContribs : members;
            if (contribs.length > 0) {
              const eachCredit = hkdAmount / contribs.length;
              contribs.forEach(p => {
                balances[p] = (balances[p] || 0) + eachCredit;
              });
            }
            return;
          }

          const rawShares = getExpenseMemberShares(exp);
          const validSplits = Object.keys(rawShares).filter(p => members.includes(p));
          if (validSplits.length === 0) return;

          if (exp.payer !== POOL_PAYER_KEY) {
            if (members.includes(exp.payer)) {
              balances[exp.payer] += hkdAmount;
            } else if (exp.payer) {
              removedPayerNegativeBalances[exp.payer] = (removedPayerNegativeBalances[exp.payer] || 0) - hkdAmount;
            }
          }

          validSplits.forEach(p => {
            const shareHKD = toHKD(rawShares[p] || 0, exp.currency, feePct);
            balances[p] -= shareHKD;
            personalConsumption[p] = (personalConsumption[p] || 0) + shareHKD;
          });
        });

        const debtors = [];
        const creditors = [];

        Object.keys(balances).forEach(m => {
          const val = Math.round(balances[m]);
          if (val < -1) debtors.push({ name: m, amount: -val });
          else if (val > 1) creditors.push({ name: m, amount: val });
        });

        debtors.sort((a, b) => b.amount - a.amount);
        creditors.sort((a, b) => b.amount - a.amount);

        const allTransactions = [];
        let i = 0, j = 0;
        while (i < debtors.length && j < creditors.length) {
          const deb = debtors[i];
          const cred = creditors[j];
          const settleAmt = Math.min(deb.amount, cred.amount);

          allTransactions.push({
            from: deb.name,
            to: cred.name,
            amount: Math.round(settleAmt)
          });

          deb.amount -= settleAmt;
          cred.amount -= settleAmt;

          if (deb.amount === 0) i++;
          if (cred.amount === 0) j++;
        }

        const activeTransactions = [];
        let paidCount = 0;
        const remainingBalances = { ...balances };

        allTransactions.forEach(t => {
          const markKey = `${t.from}__TO__${t.to}`.replace(/[.#$\[\]\/]/g, "_");
          if (settledMarks[markKey]) {
            paidCount++;
            if (remainingBalances[t.from] !== undefined) remainingBalances[t.from] += t.amount;
            if (remainingBalances[t.to] !== undefined) remainingBalances[t.to] -= t.amount;
          } else {
            activeTransactions.push(t);
          }
        });

        const spenderLeaderboard = Object.keys(personalConsumption)
          .map(name => ({ name, spentHKD: Math.round(personalConsumption[name]) }))
          .sort((a, b) => b.spentHKD - a.spentHKD);

        return {
          balances: remainingBalances,
          removedPayerNegativeBalances,
          transactions: activeTransactions,
          allTransactionsCount: allTransactions.length,
          paidCount,
          spenderLeaderboard
        };
      }, [expenses, members, rates, settledMarks, cardFeePct]);

      const categoryChartData = useMemo(() => {
        const map = {};
        realExpenses.forEach(exp => {
          const cat = exp.category || "雜項";
          const hkd = getExpHKD(exp);
          map[cat] = (map[cat] || 0) + hkd;
        });
        const list = Object.keys(map)
          .map(cat => ({
            category: cat,
            hkd: map[cat],
            percent: totalHKD > 0 ? Math.round((map[cat] / totalHKD) * 100) : 0,
            meta: getCategoryMeta(cat)
          }))
          .sort((a, b) => b.hkd - a.hkd);
        return list;
      }, [realExpenses, totalHKD, rates, categories, cardFeePct]);

      const exportToExcelCSV = () => {
        if (expenses.length === 0) {
          alert("目前未有任何帳目可以匯出！");
          return;
        }
        const headers = [
          "日期",
          "類型",
          "項目名稱",
          "分類",
          "原幣",
          "原幣金額",
          "當日匯率(兌HKD)",
          "信用卡手續費(%)",
          "折合港幣(HKD)",
          "墊支/付款方式",
          "分帳模式",
          "參與分攤成員",
          ...members.map(m => `${m} 應付(HKD)`)
        ];

        const escapeCSV = (val) => {
          const str = String(val ?? "");
          if (str.includes(",") || str.includes('"') || str.includes("\n")) {
            return `"${str.replace(/"/g, '""')}"`;
          }
          return str;
        };

        const rows = [...expenses]
          .sort((a, b) => (a.date || "").localeCompare(b.date || ""))
          .map(exp => {
            const cur = exp.currency || "HKD";
            const rate = rates[cur] || 1;
            const feePct = getExpFeePct(exp);
            const hkdTotal = Math.round(toHKD(Number(exp.amount), cur, feePct));
            const payerLabel = exp.type === "pool_topup"
              ? "公數注資"
              : exp.payer === POOL_PAYER_KEY
              ? "公數錢包支付"
              : exp.payer;
            const modeLabel = exp.type === "pool_topup"
              ? "注資"
              : exp.splitMode === "custom"
              ? "不等額逐項計"
              : "平均分攤";

            const shares = getExpenseMemberShares(exp);
            const activeSplits = (exp.splitWith || []).filter(m => members.includes(m));
            const memberCols = members.map(m => {
              if (exp.type === "pool_topup") {
                const activeC = (exp.contributors || []).filter(c => members.includes(c));
                return activeC.includes(m)
                  ? Math.round(hkdTotal / (activeC.length || 1))
                  : 0;
              }
              const s = shares[m] || 0;
              return Math.round(toHKD(s, cur, feePct));
            });

            return [
              exp.date || "",
              exp.type === "pool_topup" ? "公數注資" : "一般開支",
              exp.title || "",
              exp.category || "",
              cur,
              exp.amount || 0,
              rate,
              feePct > 0 ? `${feePct}%` : "0%",
              hkdTotal,
              payerLabel,
              modeLabel,
              (activeSplits.length > 0 ? activeSplits : members).join(" / "),
              ...memberCols
            ].map(escapeCSV).join(",");
          });

        const csvContent = "\uFEFF" + [headers.map(escapeCSV).join(","), ...rows].join("\n");
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        const safeTrip = (tripName || "TripTab").replace(/[\\/:*?"<>|]/g, "_");
        link.href = url;
        link.setAttribute("download", `${safeTrip}_完整帳目報表_${roomId}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      };

                      </div>
                      <div className="flex flex-wrap gap-1.5">
                        {members.map(m => {
                          const isSel = (editingExpense.splitWith || []).includes(m);
                          return (
                            <button
                              key={m}
                              type="button"
                              onClick={() => {
                                const curS = editingExpense.splitWith || [];
                                if (isSel && curS.length > 1) {
                                  setEditingExpense({ ...editingExpense, splitWith: curS.filter(x => x !== m) });
                                } else if (!isSel) {
                                  setEditingExpense({ ...editingExpense, splitWith: [...curS, m] });
                                }
                              }}
                              className={`px-2.5 py-1 rounded-xl text-xs font-bold border ${isSel ? 'bg-[#EFF6F2] border-[#4E8C6F] text-[#3B6E52]' : 'bg-white border-slate-200 text-slate-400'}`}
                            >
                              {isSel ? "✓ " : ""}{m}
                            </button>
                          );
                        })}
                      </div>

                      <div className="grid grid-cols-2 gap-1.5 bg-slate-100 p-1 rounded-xl">
                        <button
                          type="button"
                          onClick={() => setEditingExpense({ ...editingExpense, splitMode: "equal" })}
                          className={`py-1.5 rounded-lg text-xs font-bold ${editingExpense.splitMode === "equal" ? "bg-white text-slate-800 shadow-2xs" : "text-slate-500"}`}
                        >
                          🤝 平均平分
                        </button>
                        <button
                          type="button"
                          onClick={() => setEditingExpense({ ...editingExpense, splitMode: "custom" })}
                          className={`py-1.5 rounded-lg text-xs font-bold ${editingExpense.splitMode === "custom" ? "bg-white text-[#3B6E52] shadow-2xs" : "text-slate-500"}`}
                        >
                          ⚖️ 逐樣計 / 不等額
                        </button>
                      </div>

                      {editingExpense.splitMode === "custom" && (
                        <div className="bg-[#F5F9F6] p-2.5 rounded-2xl border border-emerald-100 space-y-1.5">
                          {editingExpense.splitWith.map(m => (
                            <div key={m} className="flex items-center justify-between gap-2 bg-white px-2.5 py-1 rounded-xl border border-slate-200/80">
                              <span className="font-bold text-slate-700 text-xs">{m}</span>
                              <input
                                type="number"
                                inputMode="decimal"
                                step="any"
                                placeholder="自動平分餘額"
                                value={editingExpense.customSplitsInput?.[m] ?? ""}
                                onChange={e => setEditingExpense({
                                  ...editingExpense,
                                  customSplitsInput: { ...(editingExpense.customSplitsInput || {}), [m]: e.target.value }
                                })}
                                className="w-28 text-right text-xs font-bold text-[#3B6E52] bg-slate-50 border border-slate-200 rounded-lg px-2 py-1"
                              />
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  </>
                )}

                <div className="flex items-center gap-2 pt-2 border-t border-slate-100">
                  <button
                    type="button"
                    onClick={() => requestDeleteExpense(editingExpense)}
                    className="px-3.5 py-2.5 rounded-xl text-xs font-extrabold bg-rose-50 text-rose-600 hover:bg-rose-100 flex items-center gap-1 transition"
                  >
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                    <span>刪除</span>
                  </button>
                  <button
                    type="button"
                    onClick={() => setEditingExpense(null)}
                    className="flex-1 py-2.5 rounded-xl text-xs font-bold bg-slate-100 text-slate-600"
                  >
                    取消
                  </button>
                  <button
                    type="submit"
                    className="flex-1 py-2.5 rounded-xl text-xs font-bold bg-[#4E8C6F] text-white hover:bg-[#3F765C] shadow-sm"
                  >
                    儲存修改
                  </button>
                </div>
              </form>
            </div>
          )}

          {/* 成員全局改名彈窗 */}
          {renamingMember && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/45 backdrop-blur-xs px-6">
              <form onSubmit={handleConfirmRenameMember} className="bg-white rounded-[28px] p-5 w-full max-w-xs shadow-2xl border border-emerald-50 space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="text-base font-extrabold text-slate-800">✏️ 修改成員名字</h3>
                  <button type="button" onClick={() => setRenamingMember(null)} className="text-slate-400 font-bold text-sm">✕</button>
                </div>
                <p className="text-xs text-slate-500">
                  將「<strong className="text-slate-700">{renamingMember}</strong>」改名為新名字後，房間內所有歷史開支、墊支同夾份記錄都會自動同步更新：
                </p>
                <input
                  type="text"
                  value={renameInputVal}
                  onChange={e => setRenameInputVal(e.target.value)}
                  className="w-full text-sm bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 font-bold focus:outline-none focus:ring-2 focus:ring-[#4E8C6F]"
                  autoFocus
                  required
                />
                <div className="grid grid-cols-2 gap-2">
                  <button type="button" onClick={() => setRenamingMember(null)} className="py-2.5 rounded-xl text-xs font-bold bg-slate-100 text-slate-600">
                    取消
                  </button>
                  <button type="submit" className="py-2.5 rounded-xl text-xs font-bold bg-[#4E8C6F] text-white shadow-sm">
                    確認全局改名
                  </button>
                </div>
              </form>
            </div>
          )}

          {/* 公數錢包注資彈窗 */}
          {showPoolModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/45 backdrop-blur-xs px-5">
              <form onSubmit={handleAddPoolTopUp} className="bg-white rounded-[28px] p-5 w-full max-w-sm shadow-2xl border border-emerald-50 space-y-4">
                <div className="flex justify-between items-center">
                  <div className="flex items-center gap-2">
                    <span className="w-9 h-9 rounded-2xl bg-teal-100 text-teal-700 flex items-center justify-center text-lg">👛</span>
                    <div>
                      <h3 className="text-base font-extrabold text-slate-800">公數錢包注資</h3>
                      <p className="text-[11px] text-slate-400">大家預先或旅途中夾錢，買飛/食飯直接扣公數</p>
                    </div>
                  </div>
                  <button type="button" onClick={() => setShowPoolModal(false)} className="text-slate-400 hover:text-slate-600 font-bold text-sm">✕</button>
                </div>

                <div className="flex items-center justify-between bg-slate-50 px-3.5 py-2 rounded-xl border border-slate-200/80">
                  <label className="text-xs font-bold text-slate-600">📅 注資日期 (可選旅途中日期)：</label>
                  <input
                    type="date"
                    value={poolDate}
                    onChange={e => setPoolDate(e.target.value)}
                    className="text-xs bg-white border border-slate-200 rounded-lg px-2.5 py-1 font-bold text-teal-800"
                    required
                  />
                </div>

                <div className="space-y-2">
                  <label className="text-xs font-bold text-slate-600">每人拿幾多錢出嚟入公數？</label>
                  <div className="flex gap-2">
                    <input
                      type="number"
                      inputMode="decimal"
                      step="any"
                      value={poolPerPersonAmt}
                      onChange={e => setPoolPerPersonAmt(e.target.value)}
                      placeholder="每人金額 (如 10000)"
                      className="flex-1 text-sm bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 font-extrabold text-teal-800"
                      required
                    />
                    <select
                      value={poolCurrency}
                      onChange={e => setPoolCurrency(e.target.value)}
                      className="bg-teal-50 border border-teal-200 rounded-xl px-3 py-2 text-sm font-extrabold text-teal-800"
                    >
                      {sortedCurrencies.map(c => (
                        <option key={c} value={c}>
                          {c === defaultCurrency ? `${c} ⭐` : c}
                        </option>
                      ))}
                    </select>
                  </div>
                </div>

                <div className="space-y-1.5">
                  <div className="flex justify-between items-center text-xs">
                    <span className="font-bold text-slate-600">邊幾個成員參與今次注資？</span>
                    <button
                      type="button"
                      onClick={() => setPoolContributors(poolContributors.length === members.length ? [members[0]] : members)}
                      className="text-teal-700 font-bold"
                    >
                      {poolContributors.length === members.length ? "只揀1人" : "全選"}
                    </button>
                  </div>
                  <div className="flex flex-wrap gap-1.5">
                    {members.map(m => {
                      const sel = poolContributors.includes(m);
                      return (
                        <button
                          key={m}
                          type="button"
                          onClick={() => {
                            if (sel && poolContributors.length > 1) {
                              setPoolContributors(poolContributors.filter(x => x !== m));
                            } else if (!sel) {
                              setPoolContributors([...poolContributors, m]);
                            }
                          }}
                          className={`px-2.5 py-1 rounded-xl text-xs font-bold border transition ${sel ? "bg-teal-50 border-teal-600 text-teal-800" : "bg-white border-slate-200 text-slate-400"}`}
                        >
                          {sel ? "✓ " : ""}{m}
                        </button>
                      );
                    })}
                  </div>
                </div>

                <div className="bg-teal-50/70 p-3 rounded-2xl border border-teal-100 text-xs flex justify-between items-center">
                  <span className="text-teal-800 font-medium">今次總共注入公數池：</span>
                  <span className="font-black text-teal-900 text-sm">
                    {poolCurrency} {((parseFloat(poolPerPersonAmt) || 0) * poolContributors.length).toLocaleString()}
                  </span>
                </div>

                <div className="grid grid-cols-2 gap-2 pt-1">
                  <button type="button" onClick={() => setShowPoolModal(false)} className="py-2.5 rounded-xl text-xs font-bold bg-slate-100 text-slate-600">
                    取消
                  </button>
                  <button type="submit" className="py-2.5 rounded-xl text-xs font-bold bg-teal-600 text-white hover:bg-teal-700 shadow-sm">
                    確認注入公數
                  </button>
                </div>
              </form>
            </div>
          )}

          {/* 刪除開支 Double Confirm 彈窗 */}
          {expenseToDelete && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/55 backdrop-blur-xs px-6">
              <div className="bg-white rounded-[28px] p-5 w-full max-w-xs shadow-2xl border border-emerald-50 text-center space-y-4">
                <div className="w-12 h-12 rounded-full bg-rose-100 text-rose-500 flex items-center justify-center mx-auto">
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2.2" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                  </svg>
                </div>
                <div className="space-y-1">
                  <h3 className="text-base font-extrabold text-slate-800">確定要刪除呢筆記錄？</h3>
                  <p className="text-xs text-slate-500">刪除後所有同行成員嘅畫面都會同步移除，無法復原。</p>
                </div>
                <div className="bg-[#F5F9F6] p-3 rounded-2xl border border-emerald-100/80 text-left">
                  <p className="text-xs font-bold text-slate-800 truncate">{expenseToDelete.title}</p>
                  <p className="text-sm font-black text-[#3B6E52] mt-0.5">
                    {expenseToDelete.currency} {Number(expenseToDelete.amount).toLocaleString()}
                  </p>
                </div>
                <div className="grid grid-cols-2 gap-2.5 pt-1">
                  <button type="button" onClick={() => setExpenseToDelete(null)} className="py-2.5 rounded-xl text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">
                    取消
                  </button>
                  <button type="button" onClick={confirmDeleteExpense} className="py-2.5 rounded-xl text-xs font-bold bg-rose-500 text-white hover:bg-rose-600 shadow-sm transition">
                    確定刪除
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 底部導覽列 */}
          <div className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/95 backdrop-blur-md border-t border-slate-100 px-6 py-2.5 flex justify-around items-center z-30 sm:rounded-b-[42px] shadow-[0_-4px_20px_rgba(0,0,0,0.04)]">
            <button onClick={() => setActiveTab("expenses")} className="flex flex-col items-center py-1 px-3 relative group">
              <svg className={`w-6 h-6 transition ${activeTab === 'expenses' ? 'text-[#3D7A5A]' : 'text-slate-400'}`} fill={activeTab === 'expenses' ? 'currentColor' : 'none'} stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-9.5z" />
              </svg>
              <span className={`text-[10px] font-bold mt-0.5 ${activeTab === 'expenses' ? 'text-[#3D7A5A]' : 'text-slate-400'}`}>記帳</span>
              {activeTab === "expenses" && <span className="w-1.5 h-1.5 rounded-full bg-[#3D7A5A] mt-0.5"></span>}
            </button>

            <button onClick={() => setActiveTab("settle")} className="flex flex-col items-center py-1 px-3 relative group">
              <svg className={`w-6 h-6 transition ${activeTab === 'settle' ? 'text-[#3D7A5A]' : 'text-slate-400'}`} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9" />
                <circle cx="12" cy="12" r="5" />
                <circle cx="12" cy="12" r="1.5" fill="currentColor" />
              </svg>
              <span className={`text-[10px] font-bold mt-0.5 ${activeTab === 'settle' ? 'text-[#3D7A5A]' : 'text-slate-400'}`}>結算 & 圖表</span>
              {activeTab === "settle" && <span className="w-1.5 h-1.5 rounded-full bg-[#3D7A5A] mt-0.5"></span>}
            </button>

            <button onClick={() => setActiveTab("rooms")} className="flex flex-col items-center py-1 px-3 relative group">
              <svg className={`w-6 h-6 transition ${activeTab === 'rooms' ? 'text-[#3D7A5A]' : 'text-slate-400'}`} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <span className={`text-[10px] font-bold mt-0.5 ${activeTab === 'rooms' ? 'text-[#3D7A5A]' : 'text-slate-400'}`}>設定</span>
              {activeTab === "rooms" && <span className="w-1.5 h-1.5 rounded-full bg-[#3D7A5A] mt-0.5"></span>}
            </button>

            <button onClick={() => setActiveTab("rates")} className="flex flex-col items-center py-1 px-3 relative group">
              <svg className={`w-6 h-6 transition ${activeTab === 'rates' ? 'text-[#3D7A5A]' : 'text-slate-400'}`} fill="none" stroke="currentColor" strokeWidth="2.2" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" d="M6 20v-5M12 20v-9M18 20V6" />
              </svg>
              <span className={`text-[10px] font-bold mt-0.5 ${activeTab === 'rates' ? 'text-[#3D7A5A]' : 'text-slate-400'}`}>匯率</span>
              {activeTab === "rates" && <span className="w-1.5 h-1.5 rounded-full bg-[#3D7A5A] mt-0.5"></span>}
            </button>
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
