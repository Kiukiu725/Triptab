<body class="text-slate-800 antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // 初始化 Firebase
    const firebaseConfig = {
      databaseURL: "https://travel-split-app-78a36-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // 常用貨幣清單
    const DEFAULT_RATES = {
      HKD: 1.0,
      JPY: 0.052,
      TWD: 0.245,
      SGD: 5.82,
      KRW: 0.0058,
      THB: 0.22,
      EUR: 8.45,
      GBP: 9.95,
      USD: 7.78,
      AUD: 5.15,
      CNY: 1.08,
      MOP: 0.97,
      CAD: 5.75,
      CHF: 8.85,
      VND: 0.00031
    };

    const DEFAULT_MEMBERS = ["我", "老公", "奶奶", "老爺", "叔仔"];

    // 分類圖示與配色 (對應圖一 Overview 圓形圖示風格)
    const CATEGORY_META = {
      "餐飲": { icon: "🍱", bg: "bg-emerald-100 text-emerald-700" },
      "交通": { icon: "🚗", bg: "bg-blue-100 text-blue-700" },
      "住宿": { icon: "🏨", bg: "bg-amber-100 text-amber-700" },
      "門票": { icon: "🎟️", bg: "bg-purple-100 text-purple-700" },
      "購物": { icon: "🛍️", bg: "bg-rose-100 text-rose-700" },
      "機票": { icon: "✈️", bg: "bg-cyan-100 text-cyan-700" },
      "雜項": { icon: "💡", bg: "bg-slate-100 text-slate-700" }
    };

    // 產生 6 位數隨機房間代碼 (避免撞房)
    const generateRoomCode = () => {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let result = "";
      for (let i = 0; i < 6; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    };

    // 格式化房間 ID
    const sanitizeRoomId = (raw) => {
      return (raw || "").trim().toUpperCase().replace(/[.#$\[\]\/]/g, "-");
    };

    // 從網址參數或本機記憶讀取房號
    const getInitialRoom = () => {
      const params = new URLSearchParams(window.location.search);
      const urlRoom = params.get("room");
      if (urlRoom && sanitizeRoomId(urlRoom)) return sanitizeRoomId(urlRoom);
      const saved = localStorage.getItem("last_travel_room");
      if (saved && sanitizeRoomId(saved)) return sanitizeRoomId(saved);
      const newRandomCode = generateRoomCode();
      localStorage.setItem("last_travel_room", newRandomCode);
      return newRandomCode;
    };

    // 內建你指定嘅圖二鼠尾草綠行李牌單據 Logo (同時支援讀取 icon.png)
    const TripTabLogo = ({ className = "w-11 h-11" }) => {
      const [imgErr, setImgErr] = useState(false);
      if (!imgErr) {
        return (
          <img
            src="icon.png"
            alt="TripTab Logo"
            onError={() => setImgErr(true)}
            className={`${className} rounded-2xl shadow-sm object-cover flex-shrink-0`}
          />
        );
      }
      return (
        <svg viewBox="0 0 120 120" className={`${className} rounded-2xl shadow-sm flex-shrink-0`}>
          <rect width="120" height="120" rx="28" fill="#6F8C74" />
          {/* 吊繩 */}
          <path d="M60 36 C58 22, 76 16, 77 25 C78 33, 62 34, 60 40" fill="none" stroke="#DFC3A4" strokeWidth="3.5" strokeLinecap="round" />
          {/* 行李牌單據主體 */}
          <path d="M48 32 L72 32 L82 44 L82 94 L75 88 L68 94 L60 88 L52 94 L45 88 L38 94 L38 44 Z" fill="#F9EFE1" />
          {/* 右側陰影折角感 */}
          <path d="M60 32 L72 32 L82 44 L82 94 L75 88 L68 94 L60 88 Z" fill="#EFE0CA" opacity="0.65" />
          {/* 打孔圓圈 */}
          <circle cx="60" cy="42" r="6" fill="#6F8C74" stroke="#D7B899" strokeWidth="3" />
          {/* 垂直與水平虛線 */}
          <line x1="60" y1="53" x2="60" y2="85" stroke="#6F8C74" strokeWidth="2.5" strokeDasharray="4 4" strokeLinecap="round" />
          <line x1="42" y1="77" x2="76" y2="77" stroke="#6F8C74" strokeWidth="2.5" strokeDasharray="4 4" strokeLinecap="round" />
          {/* 飛機小圖示 */}
          <path d="M46 68 L53 64 L55 66 L51 71 L53 74 L51 75 L48 72 L45 73 L44 72 L46 70 Z" fill="#D5B696" />
          {/* 星星裝飾 */}
          <path d="M70 53 L71.5 56.5 L75 58 L71.5 59.5 L70 63 L68.5 59.5 L65 58 L68.5 56.5 Z" fill="#D5B696" />
          {/* 剪刀小圖示 */}
          <circle cx="74" cy="74" r="2.2" fill="none" stroke="#6F8C74" strokeWidth="1.8" />
          <circle cx="74" cy="80" r="2.2" fill="none" stroke="#6F8C74" strokeWidth="1.8" />
          <line x1="68" y1="79" x2="72.5" y2="75" stroke="#6F8C74" strokeWidth="1.8" strokeLinecap="round" />
          <line x1="68" y1="75" x2="72.5" y2="79" stroke="#6F8C74" strokeWidth="1.8" strokeLinecap="round" />
        </svg>
      );
    };

    function App() {
      // 房間切換與開設狀態
      const [roomId, setRoomId] = useState(getInitialRoom);
      const [roomInput, setRoomInput] = useState("");
      const [newRoomCustomName, setNewRoomCustomName] = useState("");
      const [syncStatus, setSyncStatus] = useState("connecting");

      // 旅程雲端同步資料
      const [tripName, setTripName] = useState("新旅程記帳 ✈️");
      const [members, setMembers] = useState(DEFAULT_MEMBERS);
      const [expenses, setExpenses] = useState([]);
      const [customRates, setCustomRates] = useState({});

      // UI 狀態
      const [activeTab, setActiveTab] = useState("expenses");
      const [showAddForm, setShowAddForm] = useState(false);
      const [newMemberName, setNewMemberName] = useState("");
      const [liveRates, setLiveRates] = useState(DEFAULT_RATES);
      const [rateUpdatedText, setRateUpdatedText] = useState("載入中...");
      const [newCurCode, setNewCurCode] = useState("");
      const [newCurRate, setNewCurRate] = useState("");

      // 刪除確認彈窗狀態 (存放準備刪除嘅開支物件)
      const [expenseToDelete, setExpenseToDelete] = useState(null);

      // 表單輸入
      const [title, setTitle] = useState("");
      const [amount, setAmount] = useState("");
      const [currency, setCurrency] = useState("JPY");
      const [payer, setPayer] = useState("我");
      const [splitWith, setSplitWith] = useState(DEFAULT_MEMBERS);
      const [category, setCategory] = useState("餐飲");

      // 合併即時匯率與房間自訂匯率
      const rates = useMemo(() => {
        return { ...liveRates, ...customRates };
      }, [liveRates, customRates]);

      // 1. 載入即時公開匯率 API
      useEffect(() => {
        fetch("https://open.er-api.com/v6/latest/HKD")
          .then(res => res.json())
          .then(data => {
            if (data && data.rates) {
              const updated = {};
              Object.keys(DEFAULT_RATES).forEach(cur => {
                if (cur === "HKD") {
                  updated[cur] = 1.0;
                } else if (data.rates[cur]) {
                  updated[cur] = Number((1 / data.rates[cur]).toFixed(5));
                } else {
                  updated[cur] = DEFAULT_RATES[cur];
                }
              });
              setLiveRates(prev => ({ ...prev, ...updated }));
              setRateUpdatedText(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
            }
          })
          .catch(() => {
            setRateUpdatedText("基準匯率");
          });
      }, []);

      // 2. 監聽當前 Firebase 房間數據
      useEffect(() => {
        setSyncStatus("connecting");
        localStorage.setItem("last_travel_room", roomId);

        const url = new URL(window.location);
        url.searchParams.set("room", roomId);
        window.history.replaceState({}, "", url);

        const roomRef = db.ref(`rooms/${roomId}`);  const handleValue = (snapshot) => { const data = snapshot.val(); if (data) { setTripName(data.tripName \vert{}\vert{} "新旅程記帳 ✈️"); const loadedMembers = Array.isArray(data.members) && data.members.length > 0 ? data.members : DEFAULT_MEMBERS; setMembers(loadedMembers); setPayer(prev => loadedMembers.includes(prev) ? prev : loadedMembers[0]); setSplitWith(prev => { const valid = prev.filter(m => loadedMembers.includes(m)); return valid.length > 0 ? valid : loadedMembers; });  if (data.expenses) { const expList = Object.values(data.expenses).sort((a, b) => (b.id \vert{}\vert{} 0) - (a.id \vert{}\vert{} 0)); setExpenses(expList); } else { setExpenses([]); }  setCustomRates(data.customRates \vert{}\vert{} {}); } else { const initialRoomData = { tripName: "新旅程記帳 ✈️", members: DEFAULT_MEMBERS, expenses: {}, customRates: {}, createdAt: Date.now() }; roomRef.set(initialRoomData); } setSyncStatus("synced"); };  const handleError = (err) => { console.error("Firebase error:", err); setSyncStatus("error"); };  roomRef.on("value", handleValue, handleError); return () => roomRef.off("value", handleValue); }, [roomId]);  // 建立全新隨機 6 位數房間 + 自訂旅程名稱 const handleCreateNewRoom = (e) => { e.preventDefault(); const customTitle = newRoomCustomName.trim(); if (!customTitle) { alert("請先輸入新旅程名稱（例如：沖繩家族遊）！"); return; } const newCode = generateRoomCode(); const initialRoomData = { tripName: customTitle, members: DEFAULT_MEMBERS, expenses: {}, customRates: {}, createdAt: Date.now() }; db.ref(`rooms/${newCode}`).set(initialRoomData).then(() => {
          setRoomId(newCode);
          setNewRoomCustomName("");
          setActiveTab("expenses");
          alert(`🎉 成功建立新房間！\n\n旅程名稱：${customTitle}\n專屬 6 位房號：${newCode}\n\n你可以隨時撳「🔗 邀請入房」Share 畀同行朋友！`);
        });
      };

      // 憑代碼加入現有房間
      const handleSwitchRoom = (e) => {
        e.preventDefault();
        const clean = sanitizeRoomId(roomInput);
        if (!clean) {
          alert("請輸入房間代碼！");
          return;
        }
        db.ref(`rooms/${clean}`).once("value").then((snapshot) => { if (snapshot.exists()) { const data = snapshot.val(); setRoomId(clean); setRoomInput(""); setActiveTab("expenses"); alert(`✅ 成功進入房間：${data.tripName || clean}（房號：${clean}）`); } else { alert(`❌ 搵唔到房號「${clean}」，請檢查代碼有冇打錯！\n（如果想開新旅程，請用上面「✨ 開設新旅程房間」功能）`);
          }
        });
      };

      // 更新雲端旅程名稱
      const handleTripNameBlur = () => {
        db.ref(`rooms/${roomId}/tripName`).set(tripName); };  // 新增開支到雲端 const handleAddExpense = (e) => { e.preventDefault(); if (!title \vert{}\vert{} !amount \vert{}\vert{} splitWith.length === 0) return; const id = Date.now(); const newExp = { id, title, amount: parseFloat(amount), currency, payer, splitWith, category, date: new Date().toISOString().split("T")[0] }; db.ref(`rooms/${roomId}/expenses/${id}`).set(newExp); setTitle(""); setAmount(""); setShowAddForm(false); };  // 觸發刪除確認視窗 const requestDeleteExpense = (exp) => { setExpenseToDelete(exp); };  // 確認刪除雲端開支 const confirmDeleteExpense = () => { if (!expenseToDelete) return; db.ref(`rooms/${roomId}/expenses/${expenseToDelete.id}`).remove(); setExpenseToDelete(null); };  // 新增成員到雲端 const handleAddMember = () => { const name = newMemberName.trim(); if (!name \vert{}\vert{} members.includes(name)) return; const updated = [...members, name]; db.ref(`rooms/${roomId}/members`).set(updated);
        setSplitWith(updated);
        setNewMemberName("");
      };

      // 移除成員 (加入防誤刪確認)
      const handleRemoveMember = (name) => {
        if (members.length <= 2) return;
        if (!window.confirm(`確定要從房間移除成員「${name}」嗎？`)) return; const updated = members.filter(x => x !== name); db.ref(`rooms/${roomId}/members`).set(updated);
      };

      // 更新匯率並同步至房間
      const handleRateChange = (cur, val) => {
        const num = parseFloat(val);
        if (isNaN(num) || num <= 0) return;
        db.ref(`rooms/${roomId}/customRates/${cur}`).set(num);
      };

      // 新增自訂貨幣
      const handleAddCustomCurrency = (e) => {
        e.preventDefault();
        const code = newCurCode.trim().toUpperCase();
        const rateVal = parseFloat(newCurRate);
        if (code.length !== 3 || isNaN(rateVal) || rateVal <= 0) return;
        db.ref(`rooms/${roomId}/customRates/${code}`).set(rateVal);
        setCurrency(code);
        setNewCurCode("");
        setNewCurRate("");
      };

      // 轉換為港幣
      const toHKD = (amt, curr) => {
        const r = rates[curr] || 1;
        return amt * r;
      };

      // 總花費計算
      const totalHKD = useMemo(() => {
        return expenses.reduce((acc, exp) => acc + toHKD(Number(exp.amount), exp.currency), 0);
      }, [expenses, rates]);

      // 結算演算法
      const settlement = useMemo(() => {
        const balances = {};
        members.forEach(m => balances[m] = 0);

        expenses.forEach(exp => {
          const hkdAmount = toHKD(Number(exp.amount), exp.currency);
          const validSplits = (exp.splitWith || []).filter(p => balances[p] !== undefined);
          if (validSplits.length === 0) return;

          const share = hkdAmount / validSplits.length;

          if (balances[exp.payer] !== undefined) {
            balances[exp.payer] += hkdAmount;
          }
          validSplits.forEach(p => {
            balances[p] -= share;
          });
        });

        const debtors = [];
        const creditors = [];

        Object.keys(balances).forEach(m => {
          const val = Math.round(balances[m]);
          if (val < -1) debtors.push({ name: m, amount: -val });
          else if (val > 1) creditors.push({ name: m, amount: val });
        });

        debtors.sort((a, b) => b.amount - a.amount);
        creditors.sort((a, b) => b.amount - a.amount);

        const transactions = [];
        let i = 0, j = 0;
        while (i < debtors.length && j < creditors.length) {
          const deb = debtors[i];
          const cred = creditors[j];
          const settleAmt = Math.min(deb.amount, cred.amount);

          transactions.push({
            from: deb.name,
            to: cred.name,
            amount: Math.round(settleAmt)
          });

          deb.amount -= settleAmt;
          cred.amount -= settleAmt;

          if (deb.amount === 0) i++;
          if (cred.amount === 0) j++;
        }

        return { balances, transactions };
      }, [expenses, members, rates]);

      // 1. 邀請朋友進入當前房間 (連房間代碼)
      const shareRoomLink = () => {
        const shareUrl = `${window.location.origin}${window.location.pathname}?room=${encodeURIComponent(roomId)}`; const msg = `✈️ 一齊用 TripTab 記低「${tripName}」旅行夾錢開支！\n🔑 房間代碼：${roomId}\n👉 直接撳連結自動入房：\n${shareUrl}`;
        if (navigator.share) {
          navigator.share({
            title: `TripTab - ${tripName}`, text: msg }).catch(() => {}); } else { navigator.clipboard.writeText(msg); alert(`已複製邀請連結！直接貼去 WhatsApp 群組，朋友一撳就會自動入房「${roomId}」📲`);
        }
      };

      // 2. 純 Share App (唔連房間 ID，朋友不會入咗你間房)
      const shareCleanApp = () => {
        const cleanUrl = `${window.location.origin}${window.location.pathname}`;
